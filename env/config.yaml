http_server:
  address: ":8080"
  timeout: 10
  idle_timeout: 30

postgres:
  host: "db"
  port: "5432"
  user: "postgres"
  name: "delayed-notifier"
  password: "" # set via .env DB_PASSWORD

redis:
  host: "redis"
  port: "6379"
  password: "" # optional, code reads REDIS_PASSWORD from env

rabbit_mq:
  host: "rabbitmq"
  port: "5672"
  retries: 3
  pause: "1s"

