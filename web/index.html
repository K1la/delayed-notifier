<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DelayedNotifier UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="container">
    <header>
        <h1>DelayedNotifier</h1>
        <div class="subtle">Простая панель для создания и просмотра уведомлений</div>
    </header>

    <div class="grid">
        <section class="panel card">
            <h2>Создать уведомление</h2>
            <div class="helper">Дата и время в формате RFC3339, пример: 2025-09-22T15:15:00+03:00</div>
            <form id="create-form" class="form-row">
                <div class="field">
                    <label class="label" for="message">Сообщение</label>
                    <input type="text" id="message" required placeholder="Например: Напомнить о созвоне" />
                </div>
                <div class="field">
                    <label class="label" for="channel">Канал</label>
                    <select id="channel">
                        <option value="telegram">Telegram</option>
                        <option value="email">Email</option>
                    </select>
                </div>
                <div class="field">
                    <label class="label" for="to">Кому</label>
                    <input type="text" id="to" required placeholder="user@example.com или telegram chatID" />
                </div>
                <div class="field">
<!--                    <label class="label" for="sendat">Время (RFC3339)</label>-->
<!--                    <input type="text" id="sendat" required placeholder="2025-09-22T15:15:00+03:00" />-->

                    <label class="label" for="sendat">Когда отправить</label>

                    <!-- Календарь/время -->
                    <input type="datetime-local" id="sendat" />

                    <!-- Быстрый выбор -->
                    <select id="preset">
                        <option value="">или выберите...</option>
                        <option value="30s">Через 30 секунд</option>
                        <option value="1m">Через 1 минуту</option>
                        <option value="5m">Через 5 минут</option>
                        <option value="1h">Через 1 час</option>
                        <option value="1d">Завтра</option>
                    </select>
                </div>
                <div class="field">
                    <label class="label" for="retries">Retries</label>
                    <input type="number" id="retries" value="3" min="0" />
                </div>
                <div class="actions">
                    <button type="submit" class="btn">Создать</button>
                    <button type="reset" class="btn btn-outline">Очистить</button>
                </div>
            </form>
        </section>

        <section class="panel list">
            <h2 class="card">Список уведомлений</h2>
            <div id="list"></div>
        </section>
    </div>
</div>

<script src="./app.js"></script>
</body>
</html>
